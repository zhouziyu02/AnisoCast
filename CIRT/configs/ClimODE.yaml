# ClimODE Configuration - Compatible with CirT data format
model_args:
  model_name: "ClimODE"
  model_type: "Climate_encoder_free_uncertain"
  solver: "euler"  # ODE solver: euler, dopri5, rk4, etc.
  atol: 5e-3
  rtol: 5e-3
  step_size: null
  use_att: true
  use_err: true
  use_pos: false
  spectral: 0
  scale: 0
  lr: 0.01  # 与CirT一致
  weight_decay: 1e-5
  epochs: 20  # 与CirT一致
  batch_size: 32  # 与CirT一致
  niters: 300
  num_workers: 16  # 与CirT一致
  learning_rate: 0.01  # 与CirT一致
  t_max: 500  # 与CirT一致
  input_size: 63  # CirT standard input size
  output_size: 63  # 与CirT一致，预测所有变量
  
  # SimplifiedClimODE specific parameters (用于简化模型)
  hidden_size: 256  # 隐藏层大小，与CirT的embed_dim保持一致
  drop_rate: 0.1  # Dropout率，与CirT保持一致

data_args:
  data_dir: '/mnt/bn/gec-scl-ltm-forecast/zhouziyu/CirT/data/S2S'  # 与CirT一致
  train_years: [1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016]  # 与CirT一致
  test_years: [2018]  # 与CirT一致
  val_years: [2017]  # 与CirT一致
  n_step: 28  # 与CirT一致
  lead_time: 15  # 与CirT一致
  batch_size: 32  # 与CirT一致
  
  # 与CirT完全一致的变量配置
  single_vars: ['10m_u_component_of_wind','10m_v_component_of_wind', '2m_temperature']  # 与CirT一致
  pred_single_vars: ['10m_u_component_of_wind','10m_v_component_of_wind', '2m_temperature']  # 与CirT一致
  pred_pressure_vars: ['geopotential', 'specific_humidity', 'temperature', 'u_component_of_wind', 'v_component_of_wind', 'vertical_velocity']  # 与CirT一致
  
  # Optional: ClimODE specific paths (if available)
  const_info_path: "./era5_data/constants/constants_5.625deg.nc"
