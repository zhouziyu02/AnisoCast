# pl vars: ['u', 'v', 'z', 't', 'r']
# pl dims: {'step': 41, 'isobaricInhPa': 13, 'latitude': 721, 'longitude': 1440}
# hag10 vars: ['u10', 'v10']
# hag10 dims: {'step': 41, 'latitude': 721, 'longitude': 1440}
# hag2 vars: ['t2m']
# hag2 dims: {'step': 41, 'latitude': 721, 'longitude': 1440}



model_args:
  model_name: 'fourcastnetv2'
  input_size: 47      # = 5 PL vars * 9 levels + 2 SFC vars
  output_size: 47     # 同上
  learning_rate: 0.01
  num_workers: 12
  epochs: 200
  t_max: 500
  pred_len: 2
  only_headline: False


data_args:
  batch_size: 16
  train_years: [1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016]
  val_years: [2017]
  test_years: [2018]
  data_dir: '/mnt/bn/gec-scl-ltm-forecast/zhouziyu/EIMP/data/S2S'
  n_step: 28
  lead_time: 15

#   pred_pressure_vars: ['geopotential', 'relative_humidity', 'temperature',
#                        'u_component_of_wind', 'v_component_of_wind']
  pred_pressure_vars: ["geopotential", "temperature", "u_component_of_wind", "v_component_of_wind"]
 
  pred_single_vars: ['10m_u_component_of_wind', '10m_v_component_of_wind']
  single_vars: ['10m_u_component_of_wind', '10m_v_component_of_wind']

  # 预测本身已是物理量，因此评估时我们会跳过反归一化
  is_normalized: False
